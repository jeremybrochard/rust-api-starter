# SonarQube Project Configuration
# These values can be overridden by environment variables or command line arguments

sonar.projectKey=${env.SONAR_PROJECT_KEY:-rust-api-starter}
sonar.projectName=Rust API Starter
sonar.projectVersion=0.1.0

# Source configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*_test.rs,**/tests/**

# Rust/Clippy analysis
sonar.externalIssuesReportPaths=clippy-report.json

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage (if using cargo-tarpaulin)
# sonar.coverageReportPaths=coverage.xml

# Exclusions
sonar.exclusions=target/**,**/*.lock
